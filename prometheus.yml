global:
  scrape_interval: 10s # Set scrape interval to 10s

scrape_configs:
  - job_name: "fastapi_app"
    static_configs:
      - targets: ["fastapiapp:8000"]

  # main2.py's RabbitMQ consumer worker runs in the same container as the API
  # (see Dockerfile), just a different port. Only reachable once the "app"
  # service is enabled in docker-compose.yml (currently commented out).
  - job_name: "worker"
    static_configs:
      - targets: ["fastapiapp:8001"]

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
  
  # 🔹 Redis Exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis_exporter:9121']

  # 🔹 Postgres Exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres_exporter:9187']
