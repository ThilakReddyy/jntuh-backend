global:
  scrape_interval: 10s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: api
    static_configs: [{targets: ["app:8000"]}]
  - job_name: worker
    static_configs: [{targets: ["worker:8001"]}]
  - job_name: rabbitmq
    static_configs: [{targets: ["rabbitmq:15692"]}]
  - job_name: redis
    static_configs: [{targets: ["redis_exporter:9121"]}]
  - job_name: postgres
    static_configs: [{targets: ["postgres_exporter:9187"]}]
  - job_name: host
    static_configs: [{targets: ["host.docker.internal:9100"]}]
  - job_name: containers
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
  - job_name: loki
    static_configs: [{targets: ["loki:3100"]}]
  - job_name: tempo
    static_configs: [{targets: ["tempo:3200"]}]
  - job_name: alloy
    static_configs: [{targets: ["alloy:12345"]}]
  - job_name: grafana
    static_configs: [{targets: ["grafana:3000"]}]
  - job_name: readiness
    metrics_path: /probe
    params:
      module: [http_ready]
    static_configs:
      - targets: ["http://app:8000/health/ready"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
