apiVersion: 1

datasources:
  - name: JNTUH Prometheus
    uid: jntuh-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      timeInterval: 10s
  - name: JNTUH Loki
    uid: jntuh-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"\s*:\s*"([a-f0-9]{32})"'
          datasourceUid: jntuh-tempo
          url: '$${__value.raw}'
          urlDisplayLabel: View trace
  - name: JNTUH Tempo
    uid: jntuh-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: jntuh-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{job="docker", compose_service="app"} | json | trace_id = "$${__span.traceId}"'
      nodeGraph:
        enabled: true
      search:
        hide: false
