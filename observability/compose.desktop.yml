# Docker Desktop's VM root does not support Linux shared mount propagation.
# On EC2 use the base Compose file alone.
services:
  node_exporter:
    volumes: !override
      - /:/host:ro
  prometheus:
    # Desktop's host-gateway points at macOS, not the Linux VM network namespace.
    extra_hosts: !override
      - host.docker.internal:${DOCKER_VM_GATEWAY:-172.17.0.1}
