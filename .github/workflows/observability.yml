name: Verify Compose observability
on:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRAFANA_ADMIN_PASSWORD: ci-observability-only
      BACKGROUND_REFRESH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Prepare isolated test settings
        run: |
          cp .env.example .env
          sed -i 's/^BACKGROUND_REFRESH_ENABLED=.*/BACKGROUND_REFRESH_ENABLED=false/' .env
      - name: Application regression tests
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          prisma generate
          python -m pytest -q
      - name: Start Compose stack
        run: |
          docker compose config --quiet
          docker compose build app
          docker compose up -d --wait --wait-timeout 240
      - name: Validate metrics rules and telemetry delivery
        run: |
          docker compose exec -T prometheus promtool check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint promtool -v "$PWD/observability:/rules:ro" -w /rules prom/prometheus:v3.2.1 test rules alerts.test.yml
          python3 scripts/observability_smoke.py --skip-results
      - name: Collect diagnostics on failure
        if: failure()
        run: docker compose logs --tail=100
      - name: Stop isolated CI stack
        if: always()
        run: docker compose down -v
